name: Build PC Windows App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows App (Tauri)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Web Assets (Salin Game ke www)
        run: node mobile/tools/salin-www.js

      - name: Build Tauri Application
        run: npx @tauri-apps/cli build

      - name: Upload Windows Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: Soul-Essence-Windows-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14

      - name: Upload Windows Standalone Executable
        uses: actions/upload-artifact@v4
        with:
          name: Soul-Essence-Windows-Portable
          path: src-tauri/target/release/soul-essence.exe
          retention-days: 14
