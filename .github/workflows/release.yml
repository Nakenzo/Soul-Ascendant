name: Release Soul Ascendant

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag Rilis (contoh: latest atau v0.1.0)'
        required: true
        default: 'latest'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm ci

      - name: Build Web Assets (Salin Game ke www)
        working-directory: mobile
        run: npm run build:www

      - name: Copy & Sync Web Assets to Android
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/assets
          npx cap copy android
          npx cap sync android
          ls -la android/app/src/main/assets/public

      - name: Grant Execute Permission to Gradlew
        run: chmod +x mobile/android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Release File
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Soul-Ascendant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: Soul-Ascendant.apk
          retention-days: 7

  build-pc:
    name: Build PC Windows App (Tauri)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets (Salin Game ke www)
        run: node mobile/tools/salin-www.js

      - name: Build Tauri Application
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Windows Release Files
        shell: bash
        run: |
          cp src-tauri/target/release/bundle/nsis/*.exe Soul-Ascendant-Setup.exe
          cp src-tauri/target/release/bundle/msi/*.msi Soul-Ascendant.msi || true

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: |
            Soul-Ascendant-Setup.exe
            Soul-Ascendant.msi
          retention-days: 7

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-android, build-pc]
    runs-on: ubuntu-latest

    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-artifact

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-artifact

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Soul Ascendant (${{ steps.release_tag.outputs.tag }})"
          body: |
            ## Soul Ascendant - Game Release

            Unduh versi game Soul Ascendant yang sesuai dengan perangkatmu:
            - 📱 **Android**: [Soul-Ascendant.apk](https://github.com/Nakenzo/Soul-Ascendant/releases/download/${{ steps.release_tag.outputs.tag }}/Soul-Ascendant.apk) *(Langsung pasang di HP tanpa ZIP)*
            - 💻 **Windows PC (Installer NSIS)**: [Soul-Ascendant-Setup.exe](https://github.com/Nakenzo/Soul-Ascendant/releases/download/${{ steps.release_tag.outputs.tag }}/Soul-Ascendant-Setup.exe)
            - 💻 **Windows PC (Paket MSI)**: [Soul-Ascendant.msi](https://github.com/Nakenzo/Soul-Ascendant/releases/download/${{ steps.release_tag.outputs.tag }}/Soul-Ascendant.msi)
            - 🌐 **Web Game (Main di Browser)**: [https://nakenzo.github.io/Soul-Ascendant/](https://nakenzo.github.io/Soul-Ascendant/)
          files: |
            Soul-Ascendant.apk
            Soul-Ascendant-Setup.exe
            Soul-Ascendant.msi
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
