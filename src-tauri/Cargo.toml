[package]
name = "soul-essence"
version = "0.1.0"
description = "Soul Essence - 2D Action Roguelike"
authors = ["Soul Essence Team"]
edition = "2021"

[lib]
name = "soul_essence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
