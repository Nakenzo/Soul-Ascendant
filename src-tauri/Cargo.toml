[package]
name = "soul-essence"
version = "0.1.0"
description = "Soul Essence - 2D Action Roguelike"
authors = ["Soul Essence Team"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "soul_essence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2" }
tauri-plugin-log = "2"
